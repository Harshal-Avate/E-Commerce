{% load cart_extras %}

<h1>Your Cart</h1>

{% for product in products %}

<div>

<h2>{{ product.name }}</h2>

<p>Price: ₹{{ product.price }}</p>

<p>Quantity: {{ cart|get_item:product.id }}</p>

{% if product.image %}
<img src="{{ product.image.url }}" width="150">
{% endif %}

<br><br>

<a href="{% url 'remove_from_cart' product.id %}">Remove</a>

</div>

<hr>

{% empty %}

<p>Your cart is empty</p>

{% endfor %}

<h2>Total Price: ₹{{ total_price }}</h2>
